name: Vadim no-frame H4 validation

concurrency:
  group: vadim-no-frame-h4
  cancel-in-progress: true

on:
  push:
    branches: [vadim-no-frame-h4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-no-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: pip install -r requirements.txt qiskit-aer

      - name: Run Aria no-frame pooled H4
        env:
          PYTHONHASHSEED: "0"
        run: |
          python vqe/task60_vadim_no_frame_h4.py             --backend aria-1             --checkpoint             vqe/task39c_ancilla_real_submission_draw1.partial.json,vqe/task39c_ancilla_real_submission_draw2.partial.json,vqe/task39c_ancilla_real_submission_draw3.partial.json

      - name: Run Forte no-frame pooled H4
        env:
          PYTHONHASHSEED: "0"
        run: |
          python vqe/task60_vadim_no_frame_h4.py             --backend forte-1             --checkpoint             vqe/task39c_ancilla_real_submission_draw1.partial.json,vqe/task39c_ancilla_real_submission_draw2.partial.json,vqe/task39c_ancilla_real_submission_draw3.partial.json

      - name: Upload no-frame results
        uses: actions/upload-artifact@v4
        with:
          name: vadim-no-frame-h4-results
          path: vqe/task60_vadim_no_frame_*_result.json
